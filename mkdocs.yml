site_name: TRUST Protocol
site_url: https://jarethmt.github.io/TRUST-Protocol/
site_description: Credential broker and trust infrastructure for AI agents
repo_url: https://github.com/jarethmt/TRUST-Protocol
repo_name: jarethmt/TRUST-Protocol

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/default-dark.js
  - javascripts/landing.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Guides:
    - Credential Proxy: guides/credential-proxy.md
    - Skill Signing: guides/skill-signing.md
    - Trust Tiers: guides/trust-tiers.md
    - Emergency Controls: guides/emergency-controls.md
    - Platform Integration: guides/integration.md
  - Reference:
    - REST API: reference/api.md
    - Python SDK: reference/sdk.md
    - CLI: reference/cli.md
    - Configuration: reference/configuration.md
  - Deployment:
    - Docker: deployment/docker.md
  - Security:
    - Architecture: security/architecture.md
    - Known Gaps: security/known-gaps.md
  - Roadmap: roadmap.md
  - Brand:
    - Identity Guide: brand-identity.md
    - The Logo: design-story.md
